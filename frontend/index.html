<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a0f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf9" />
    <meta
      name="description"
      content="Portfolio of Shefali Sharma, AI Engineer — every claim linked to the experience that evidences it."
    />

    <!--
      Fonts load from Google Fonts rather than an npm package, so this adds no
      dependency. Every family falls back to a system stack in index.css, so a
      blocked or slow font never leaves the page unstyled.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Shefali Sharma — AI Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
